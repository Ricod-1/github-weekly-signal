name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 安装依赖
        # 使用 npm install 而非 npm ci：
        # npm ci 会严格校验 package-lock.json 与 package.json 的一致性，
        # 历史 lock 与当前 package.json 不同步时会导致安装直接失败（EUSAGE）。
        # npm install 按 package.json 安装并自动同步 lock，避免该问题。
        run: npm install

      - name: 代码格式检查
        run: npm run format:check

      - name: 代码 lint
        run: npm run lint

      - name: 运行测试
        run: npm test